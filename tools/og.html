<!doctype html>
<!-- Source for og-image.jpg. Render with tools/make-og.sh (headless Chrome, 1200x630). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #141A15; font-family: "Bricolage Grotesque", sans-serif; color: #EEE6D4; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 45%; }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgb(20 26 21 / .96) 0%, rgb(20 26 21 / .86) 34%, rgb(20 26 21 / .2) 62%, rgb(20 26 21 / 0) 80%),
    linear-gradient(0deg, rgb(20 26 21 / .55), rgb(20 26 21 / 0) 40%); }
  .copy { position: absolute; left: 64px; top: 46px; width: 560px; }
  .logo { width: 300px; display: block; margin-left: -10px; }
  h1 { margin-top: 18px; font-size: 64px; line-height: .98; font-weight: 750; font-stretch: 86%; letter-spacing: -0.03em; }
  .what { margin-top: 18px; font-size: 25px; color: #D8D0BE; }
  .pill { display: inline-flex; align-items: center; gap: 12px; margin-top: 26px; padding: 13px 24px; border-radius: 999px; background: #F0B23A; color: #1A1508; font-weight: 700; font-size: 25px; }
  .pill i { font-size: 30px; }
  .note { position: absolute; right: 56px; bottom: 40px; font-family: Caveat, cursive; font-weight: 600; font-size: 40px; color: #E0AE95; transform: rotate(-3deg); text-shadow: 0 2px 16px rgb(20 26 21 / .8); }
</style>
</head>
<body>
  <img class="bg" src="../assets/img/hero-desktop.webp" alt="">
  <div class="shade"></div>
  <div class="copy">
    <img class="logo" src="../assets/img/logo-sm.webp" alt="">
    <h1>Horse riding lessons<br>in Paarl</h1>
    <p class="what">From age 4. Outrides and therapeutic riding at Salmonsvlei Farm.</p>
    <p class="pill"><i class="ph ph-whatsapp-logo"></i> Trial session R200 | 063 774 9148</p>
  </div>
  <p class="note">Where horses become family</p>
</body>
</html>
